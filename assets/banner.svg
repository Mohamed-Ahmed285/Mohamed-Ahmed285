  <rect x="40" y="40" width="580" height="184" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <text x="68" y="122" font-size="56" font-weight="800" fill="#111827">Mohamed Ahmed</text>
  <rect x="68" y="140" width="360" height="10" fill="#f97316"/>
